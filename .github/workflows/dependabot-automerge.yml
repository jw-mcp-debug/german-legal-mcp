name: Dependabot auto-merge

# Auto-merges ONLY Dependabot PRs, ONLY for patch/minor updates. The actual merge
# is performed by GitHub ONLY after the required status checks pass — that gate is
# enforced by the branch-protection ruleset on `develop`, not by this workflow.
# Major bumps are left for manual review and are NEVER auto-merged.
#
# Prerequisites configured on the repo:
#   - Settings > General > "Allow auto-merge" is enabled.
#   - Branch protection on `develop` requires the `verify` and `security` checks.
# Note: the `security` job runs gitleaks secret-scanning. Dependency-vulnerability
# scanning is handled by the Snyk GitHub App integration (its own PR checks); add
# that check to the develop required-checks list if you want it to block merges too.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Guard on the immutable PR AUTHOR, not github.actor (which is the last actor
    # and is spoofable via a comment-triggered force push).
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        # SHA-pinned to match repo supply-chain hygiene (tag for clarity: v3.1.0).
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for patch and minor updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
