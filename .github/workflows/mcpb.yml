name: Build MCPB bundle

# Builds the Claude Desktop MCP Bundle (.mcpb) and attaches it to the GitHub
# Release as a downloadable asset. Public-repo-only workflow (protected from the
# private→public mirror by an exclude in sync.yml), analogous to release.yml /
# publish-npm.yml. The bundle is pure-JS, so one artifact is cross-platform
# (Windows + macOS, arm64 + x64) — Claude Desktop supplies the Node runtime.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mcpb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prune dev dependencies (bundle ships production node_modules)
        run: npm prune --omit=dev

      - name: Sync manifest version to package.json
        run: |
          node -e "const fs=require('fs');const pkg=require('./package.json');const m=require('./manifest.json');m.version=pkg.version;fs.writeFileSync('manifest.json',JSON.stringify(m,null,2)+'\n');console.log('manifest version ->',pkg.version)"

      - name: Pack MCPB bundle
        run: npx -y @anthropic-ai/mcpb@2.1.2 pack . german-legal-mcp.mcpb

      - name: Attach .mcpb to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then TAG="$(gh release view --json tagName -q .tagName)"; fi
          gh release upload "$TAG" german-legal-mcp.mcpb --clobber
          echo "Attached german-legal-mcp.mcpb to $TAG"
