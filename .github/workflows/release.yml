name: Auto Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Check version and create release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//')

          if [ -n "$LATEST" ]; then
            HIGHER=$(node -e "
              const [a,b] = ['$VERSION','$LATEST'].map(v => v.split('-')[0].split('.').map(Number));
              process.exit((a[0]-b[0] || a[1]-b[1] || a[2]-b[2]) > 0 ? 0 : 1);
            " && echo "yes" || echo "no")

            if [ "$HIGHER" = "no" ]; then
              echo "v$VERSION is not higher than latest v$LATEST, skipping."
              exit 0
            fi
          fi

          echo "Creating release v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes
