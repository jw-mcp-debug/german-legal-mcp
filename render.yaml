# Render blueprint for a test deployment of the MCP server over HTTP.
#
# The server speaks stdio by default; GLMCP_HTTP switches it to Streamable HTTP
# on Render's assigned $PORT, served at POST /mcp behind a bearer token. The
# token is generated by Render — read it once from the service's Environment tab
# and give it to the client; it is never in this file or in git.
#
# Deploy: Render Dashboard → New → Blueprint → this repository and branch.
services:
  - type: web
    name: german-legal-mcp
    runtime: node
    # Frankfurt: the portals this server reads are German, and a test deployment
    # should not reach them from another continent.
    region: frankfurt
    # Free instances spin down when idle and take ~30s to answer the first
    # request afterwards. Fine for testing; not for a client that times out fast.
    plan: free
    branch: fix/jportal-section-ids-and-toc
    # --include=dev is not optional: Render sets NODE_ENV=production for Node
    # services, and under that npm ci omits devDependencies — which is where
    # typescript lives. Without it the build "succeeds" having compiled nothing,
    # and the service dies at startup on a missing dist/index.js.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /healthz
    envVars:
      # package.json requires >= 25; Render otherwise picks its own default.
      - key: NODE_VERSION
        value: "25"
      - key: GLMCP_HTTP
        value: "true"
      # Generated once by Render and kept secret. The server refuses to start
      # without it rather than exposing an unauthenticated endpoint.
      - key: GLMCP_HTTP_TOKEN
        generateValue: true
      - key: NODE_ENV
        value: production
